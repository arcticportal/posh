name: Angular Docker Build and Push

on:
  workflow_call:
    inputs:
      push:
        description: 'Push the built image to ACR'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to ACR'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_and_push_angular_docker:
    runs-on: ubuntu-latest
    outputs:
      angular_env: ${{ steps.determine_env.outputs.ANGULAR_ENV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine Angular Environment
        id: determine_env
        run: |
          if [ "${{ inputs.push }}" == "true" ] && [ "${{ github.ref_name }}" == "main" ]; then
            echo "ANGULAR_ENV=production" >> $GITHUB_OUTPUT
          else
            echo "ANGULAR_ENV=development" >> $GITHUB_OUTPUT
          fi

      - name: Echo Angular Environment
        run: echo "Using ANGULAR_ENV=${{ steps.determine_env.outputs.ANGULAR_ENV }}"

      - name: Log in to Azure Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: arcticportal.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: arcticportal.azurecr.io/posh/angular
          tags: |
            type=raw,value=${{ github.ref_name }}-{{date 'YYYY-MM-DD'}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push Angular Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/frontend/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ANGULAR_ENV=${{ steps.determine_env.outputs.ANGULAR_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max