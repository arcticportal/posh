# .github/workflows/angular-build.yml
name: Angular Docker Build and Push

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel any in-progress runs of this workflow for the same branch
  # This is useful to avoid multiple builds for the same branch
  # and to save resources.
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev # Match branch name used in wagtail workflow
    paths:
      - 'angular/**'
      # - 'deploy/frontend/**'
      # - 'deploy/docker-compose-*.yml'
      - '.github/workflows/angular-build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev # Match branch name used in wagtail workflow
    paths:
      - 'angular/**'
      # - 'deploy/frontend/**'
      # - 'deploy/docker-compose-*.yml'
      - '.github/workflows/angular-build.yml'



jobs:
  build_and_push_angular_docker:
    runs-on: ubuntu-latest
    outputs:
      angular_env: ${{ steps.determine_env.outputs.ANGULAR_ENV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Angular Environment
        id: determine_env
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "ANGULAR_ENV=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "dev" ]; then
            echo "ANGULAR_ENV=dev" >> $GITHUB_OUTPUT # Was staging, now dev
          else
            echo "ANGULAR_ENV=local" >> $GITHUB_OUTPUT # Was development, now local
          fi

      - name: Echo Angular Environment
        run: echo "Using ANGULAR_ENV=${{ steps.determine_env.outputs.ANGULAR_ENV }}"

      - name: Log in to Azure Container Registry
        # Only login on push (secrets). On PR/workflow_call we only build, never push.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: arcticportal.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: arcticportal.azurecr.io/posh/angular
          tags: |
            type=raw,value=${{ github.ref_name }}-{{date 'YYYY-MM-DD'}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push Angular Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/frontend/Dockerfile
          push: ${{ github.event_name == 'push' }} # Only push on direct pushes to main/dev
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ANGULAR_ENV=${{ steps.determine_env.outputs.ANGULAR_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
