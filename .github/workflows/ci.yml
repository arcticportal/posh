name: CI Gate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main only receives promotions from dev; block any other PR source branch.
  main-source-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: PRs to main must come from dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs targeting main must originate from the dev branch (head: ${{ github.head_ref }})"
            exit 1
          fi
          echo "promotion PR from dev - ok"

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      angular: ${{ steps.f.outputs.angular }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: f
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          # push: base=pushed branch so dorny diffs github.event.before..head (not default_branch); PR ignores 'base'.
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/backend/**'
            angular:
              - 'angular/**'
              - 'deploy/frontend/**'

  angular-build:
    needs: changes
    if: needs.changes.outputs.angular == 'true'
    uses: ./.github/workflows/angular-build.yml
    with:
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  backend-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-build.yml
    with:
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  gate:
    needs: [main-source-check, angular-build, backend-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          for r in "${{ needs.main-source-check.result }}" "${{ needs.angular-build.result }}" "${{ needs.backend-build.result }}"; do
            echo "result=$r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "blocked by a failed/cancelled job"
              exit 1
            fi
          done
          echo "gate passed"