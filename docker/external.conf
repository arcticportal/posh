server {
  listen 80;
  server_name posdt.arcticportal.org;
  return 301 https://posdt.arcticportal.org$request_uri; }

server {
  listen 443 ssl;
  server_name posdt.arcticportal.org;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  ssl_certificate /etc/letsencrypt/live/posdt.arcticportal.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/posdt.arcticportal.org/privkey.pem;

  location / {
    proxy_pass http://host.docker.internal:60011;  # internal nginx

    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr; } }
